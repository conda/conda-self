[build-system]
requires = ["hatchling>=1.12.2", "hatch-vcs>=0.2.0"]
build-backend = "hatchling.build"

[project]
name = "conda-self"
description = "A self command for conda"
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
  "Operating System :: OS Independent",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy"
]
dependencies = [
  # "conda >=26.11.0.dev66",  # not on PyPI, installed via conda
]
dynamic = ["version"]

[project.urls]
documentation = "https://conda.github.io/conda-self/"
repository = "https://github.com/conda/conda-self"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "conda_self/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.cursor", "/.kilo"]

[project.entry-points.conda]
"conda-self" = "conda_self.plugin"

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["conda_self"]
relative_files = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
omit = ["conda_self/_version.py"]
show_missing = true
skip_covered = true
sort = "Miss"

[tool.ty.src]
include = ["conda_self", "tests"]
exclude = ["conda_self/_version.py", "tests/data"]

[tool.ty.analysis]
# hatch-vcs creates this module during build and editable installation.
allowed-unresolved-imports = ["conda_self._version"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
flake8-type-checking = {exempt-modules = [], strict = true}
# see https://docs.astral.sh/ruff/rules/
select = [
  # "D1",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "FA",  # flake8-future-annotations
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat
  "RUF100",  # Unused noqa directive
  "T10",  # flake8-debugger
  "TCH",  # flake8-type-checking
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"
# Bootstrap the pinned conda source below until conda 26.11.0 is released.
conda = ">=26.10.0"
conda-pypi = ">=0.13.0"
pip = "*"

[tool.pixi.tasks]
build-conda = "python -m pip wheel --no-deps --wheel-dir .pixi/conda-source/$PIXI_ENVIRONMENT_NAME https://github.com/conda/conda/archive/bdbad6818c317c7559c06da70923e268a4eacd44.tar.gz#sha256=83ed2056a20895fa45c8e4402269d32c1c1221d9a23d47b3eadd9ddda1f7f6a7"
convert-conda = { cmd = "rm -f .pixi/conda-source/$PIXI_ENVIRONMENT_NAME/noarch/conda-26.11.0.dev66-pypi_0.conda && python -m conda pypi convert --output-folder .pixi/conda-source/$PIXI_ENVIRONMENT_NAME/noarch .pixi/conda-source/$PIXI_ENVIRONMENT_NAME/conda-26.11.0.dev66-py3-none-any.whl", depends-on = ["build-conda"] }
install-conda = { cmd = "python -m conda install --yes --no-deps .pixi/conda-source/$PIXI_ENVIRONMENT_NAME/noarch/conda-26.11.0.dev66-pypi_0.conda", depends-on = ["convert-conda"], env = { CONDA_SOLVER = "libmamba" } }
conda = { cmd = "python -m conda", depends-on = ["install-conda"], env = { CONDA_CHANNELS = "conda-forge" } }

[tool.pixi.tasks.demos]
cmd = """bash -c 'if [ -n "$1" ]; then vhs "demos/$1.tape"; else for tape in demos/*.tape; do [[ "$(basename "$tape")" == _* ]] && continue; vhs "$tape"; done; fi' -- {{ name }}"""
args = [{ arg = "name", default = "" }]
description = "Record demo GIFs"

[tool.pixi.feature.build]
dependencies = { conda-build = "*", anaconda-client = "*" }

[tool.pixi.feature.build.tasks]
index-conda = { cmd = "python -m conda_index .pixi/conda-source/$PIXI_ENVIRONMENT_NAME", depends-on = ["convert-conda"] }
build = { cmd = "conda build recipe --channel ./.pixi/conda-source/$PIXI_ENVIRONMENT_NAME", depends-on = ["index-conda"] }

[tool.pixi.feature.docs]
channels = [
  "conda-forge",  # Force it for docs, not available in defaults
]
[tool.pixi.feature.docs.tasks]
docs = { cmd = "python -m sphinx.cmd.build -M dirhtml . _build", cwd = "docs", depends-on = ["install-conda"] }
serve = { cmd = "python -m http.server", cwd = "docs/_build/dirhtml" }
clean = { cmd = "rm -rf _build", cwd = "docs" }

[tool.pixi.feature.docs.dependencies]
python = "3.11.*"
conda-sphinx-theme = { version = "*", channel = "conda-forge" }
myst-parser = "*"
sphinx = "*"
sphinx-copybutton = "*"
sphinx-design = "*"

[tool.pixi.feature.test.tasks]
install-self = { cmd = "python -m conda pypi install --editable . --yes", depends-on = ["install-conda"], env = { CONDA_SOLVER = "libmamba" } }
test = { cmd = "python -m pytest --cov --cov-report=term-missing --cov-report=xml", depends-on = ["install-self"], env = { CONDA_SOLVER = "libmamba" } }
coverage = { cmd = "python -m coverage html", depends-on = ["test"], description = "Run tests and generate an HTML coverage report" }
coverage-serve = { cmd = "python -m http.server 0 --bind 127.0.0.1 --directory htmlcov", depends-on = ["coverage"], description = "Run tests and serve the HTML coverage report locally" }
pre-commit = 'pre-commit'
lint = 'pre-commit'

[tool.pixi.feature.test]
[tool.pixi.feature.test.dependencies]
coverage = ">=7.13"
editables = "*"
hatch-vcs = ">=0.2.0"
hatchling = ">=1.12.2"
pytest = "*"
pytest-cov = ">=7"
pytest-mock = "*"
pre-commit = "*"

[tool.pixi.feature.typecheck]
channels = [
  "conda-forge",  # Force it for type checking, not available in defaults
]

[tool.pixi.feature.typecheck.dependencies]
pytest = "*"
pytest-mock = "*"
ty = "==0.0.78"

[tool.pixi.feature.typecheck.tasks]
typecheck = { cmd = "ty check", depends-on = ["install-conda"] }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py311.activation.env]
# Avoid native shutdown crashes under coverage's C tracer on Python 3.11.
COVERAGE_CORE = "pytrace"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py315.dependencies]
python = "3.15.*"

[tool.pixi.environments]
dev = ["py311"]
build = ["build"]
docs = ["docs"]
test-py311 = ["test", "py311"]
test-py312 = ["test", "py312"]
test-py313 = ["test", "py313"]
test-py314 = ["test", "py314"]
test-py315 = ["test", "py315"]
typecheck = ["typecheck", "py315"]
